name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Tests with coverage gate
        run: |
          coverage run -m unittest discover -s tests -t .
          coverage report --fail-under=85
      - name: Installed commands work
        run: |
          job-alerts --help > /dev/null
          job-alerts-eval --corpus examples/sample_corpus.jsonl

  quality:
    name: Lint, format and types (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.20 mypy==2.4.1
      - run: ruff check tools/job_alerts.py tools/alerting tools/eval_alerts.py tests
      - run: ruff format --check tools/job_alerts.py tools/alerting tools/eval_alerts.py tests
      - name: Type check
        working-directory: tools
        run: mypy --ignore-missing-imports --follow-imports=silent --python-version 3.10 job_alerts.py eval_alerts.py alerting

  portals:
    name: Portal CLI (${{ matrix.portal }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        portal: [getonbrd-search, remotive-search, himalayas-search]
    defaults:
      run:
        working-directory: portals/${{ matrix.portal }}/cli
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: bun install
      - run: bun run typecheck
      - run: bun test --timeout 30000
